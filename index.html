<!DOCTYPE html>
<html>
  <head>
  <title>Berserk</title>
  <style>
    body {
      font-family: Helvetica, sans-serif;
      background-color: rgb(0, 0, 0);
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      background-image: url(guts.jpg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow: hidden; 
    }

    #me {
      width: 200px;
      height: 100px;
      padding-top: 10px;
      padding-left: 25px;
      float: left;
    }

    .abay {
      width: 40px;
      height: 20px;
      float: left;
      margin-top: 10px;
    }

    .nav {
      position: fixed;
      width: 400px;
      height: 50px;
      float: left;
      max-width: 100%;
      z-index: 10;
    }

    ul {
      display: flex;
      padding-left: 30px;
      margin: 25px 0px 0px 0px;
    }

    ul li {
      list-style: none;
      margin: 0px 0px 0px 50px;
      font-size: 15px;
      font-weight: bolder;
    }

    ul li a {
      color: rgb(184, 0, 0);
      font-size: 17px;
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      letter-spacing: 4px;
      font-weight: 100;
      text-decoration: none;
    }

    a:hover {
      color: rgb(0, 0, 0);
      background-color: rgb(255, 7, 7);
      border-radius: 3px;
      opacity: 0.6;
      box-shadow: 0 0 10px 10px rgb(255, 7, 7);
    }
    
    .login-container {
      position: absolute;
      background-color: black;
      border-radius: 10px;
      padding: 50px;
      width: 190px;
      height: 370px;
      left: 73%;
      top: 80px;
      border: 2px solid rgb(68, 0, 0);
      opacity: 0.8;
      box-shadow: 0 0 30px 10px rgb(180, 30, 30);
    }
    h2 {
      text-align: center;
      color: white;
      font-size: 15px;
      font-family: monospace;
    }
    
    label {
        display: block;
        margin-bottom: 3px;
        margin-left: 13px;
        font-size: 10px;
        font-weight: bold;
        color: white;
    }
    .avatar {
      opacity: 1.0;
      margin-left: 10px;
    }
    
    input[type="text"],
    input[type="password"] {
        width: 100%;
        max-width: 150px;
        font-size: 13px;
        padding: 7px;
        margin-bottom: 5px;
        margin-left: 11px;  
        border: 1px solid #ccc;
        border-radius: 5px;
    } 
    
    input[type="submit"] {
        width: 100%;
        max-width: 150px;
        background-color: #f11e1e;
        font-size: 15px;
        font-weight: bold;
        color: #fff;
        padding: 5px;
        border: none;
        margin-left: 20px;
        border-radius: 4px;
        cursor: pointer;
    }

    @media (max-width: 1024px) {
      .login-container {
        left: 60%;
      }
    }
    @media (max-width: 768px) {
      .login-container {
        left: 50%;
        transform: translateX(-50%);
      }
    }
    @media (max-width: 480px) {
      .login-container {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
    }
  </style>
  </head>
  <body>
    <div class="nav">
      <img src="berserkk.png" alt="Odin's Army Emblem" id="me">
      <img src="berk.png" alt="ABAY" class="abay">
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="service.html">SERVICE</a></li>
        <li><a href="">DESIGN</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
    </div>
    <div class="login-container">
      <img src="OdinsArmy.png" width="170" height="170" alt="Avatar" class="avatar">
      <h2>“There’s no paradise... For you to escape to”</h2>
      <form method="post" action="login.php">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required>
        <br><br>
        <input type="submit" value="Login">
      </form>
    </div>
  </body>
</html>
